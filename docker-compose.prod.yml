services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexttrade
      POSTGRES_PASSWORD: nexttrade
      POSTGRES_DB: nexttrade
    # 生产环境不对外暴露数据库端口，仅内网访问
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexttrade']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 生产环境不对外暴露 Redis 端口，仅内网访问
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      PORT: '3001'
      DATABASE_URL: postgres://nexttrade:nexttrade@postgres:5432/nexttrade
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGIN: https://bitcoooin.cn
      # 显式禁用代理，避免服务器环境变量 HTTPS_PROXY 干扰
      HTTPS_PROXY: ''
      HTTP_PROXY: ''
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 构建时注入公网 HTTPS 地址，使客户端 JS 不走 HTTP 混合内容
        NEXT_PUBLIC_API_URL: https://bitcoooin.cn
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # 运行时 Next.js 服务端用内部地址做 rewrites 代理
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./apk:/downloads
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
